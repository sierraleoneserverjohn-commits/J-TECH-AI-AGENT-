name: Build JEXA Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7 & AGP 8 require Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Recreate Capacitor Android platform
        run: |
          rm -rf android
          npx cap add android

      - name: Generate App Icons and Android Splash Assets
        run: |
          node scripts/make-icons.mjs
          npx @capacitor/assets generate --android

      - name: Patch Android Configuration (Fullscreen, cutout, permissions, immersive mode)
        run: node scripts/patch-android.mjs

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jexa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
