name: Build JEXA Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create fresh Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Patch Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s|<activity|<activity android:screenOrientation="sensorLandscape"|' $M
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>|' $M

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jexa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
