name: Build JEXA Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7 and AGP 8 require Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      # Always create a fresh Android project so a half-empty folder can never break the build
      - name: Create fresh Android project
        run: |
          rm -rf android
          npx cap add android
          ls android

      - name: Generate App Icons and Android Splash Assets
        run: |
          node scripts/make-icons.mjs
          npx @capacitor/assets generate --android

      - name: Patch AndroidManifest.xml (landscape and permissions)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          # Landscape on the first activity (the tag spans several lines in the template)
          if ! grep -q "sensorLandscape" "$MANIFEST"; then
            sed -i '0,/<activity/s|<activity|<activity android:screenOrientation="sensorLandscape"|' "$MANIFEST"
          fi
          # Permissions, added before the closing manifest tag
          for PERM in android.permission.RECORD_AUDIO android.permission.MODIFY_AUDIO_SETTINGS android.permission.INTERNET; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$PERM\" />\n</manifest>|" "$MANIFEST"
            fi
          done
          cat "$MANIFEST"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jexa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
